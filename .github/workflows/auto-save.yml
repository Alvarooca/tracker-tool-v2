name: Auto Save PnL Diario

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta todos los días a las 00:00 UTC
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub cuando quieras probarlo

jobs:
  autosave:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Trigger App Autosave
        uses: puppeteer/puppeteer-script@v1 # O la acción de navegador que uses para abrir tu URL
        with:
          args: "https://alvarooca.github.io/tracker-tool-v2/?autosave=true"
